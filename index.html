<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tribe Fartlek</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-first column. The top card floods with the current effort colour; what's next sits right under the clock; the full plan follows. */
:root{
  --bg:#E9EEF1; --surface:#F7F9FA; --ink:#10202B; --muted:#5B6D79; --line:#CBD5DB;
  --easy:#14697A; --on-easy:#FFFFFF;
  --steady:#2B6B45; --on-steady:#FFFFFF;
  --tempo:#F0B323; --on-tempo:#1B1400;
  --hard:#D63A20; --on-hard:#FFFFFF;
  --sprint:#7D1846; --on-sprint:#FFFFFF;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1318; --surface:#162027; --ink:#E9EEF1; --muted:#8FA0AB; --line:#2A3842;
  --easy:#2FA7BD; --on-easy:#04181C; --steady:#4FB37A; --on-steady:#04170C;
  --tempo:#F2B91E; --on-tempo:#1B1400; --hard:#F0553A; --on-hard:#180805;
  --sprint:#E0508F; --on-sprint:#1C0410; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1318; --surface:#162027; --ink:#E9EEF1; --muted:#8FA0AB; --line:#2A3842;
  --easy:#2FA7BD; --on-easy:#04181C; --steady:#4FB37A; --on-steady:#04170C;
  --tempo:#F2B91E; --on-tempo:#1B1400; --hard:#F0553A; --on-hard:#180805;
  --sprint:#E0508F; --on-sprint:#1C0410; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.e-easy{--c:var(--easy);--oc:var(--on-easy)}
.e-steady{--c:var(--steady);--oc:var(--on-steady)}
.e-tempo{--c:var(--tempo);--oc:var(--on-tempo)}
.e-hard{--c:var(--hard);--oc:var(--on-hard)}
.e-sprint{--c:var(--sprint);--oc:var(--on-sprint)}
.e-none{--c:var(--surface);--oc:var(--ink)}

.stage{background:var(--c);color:var(--oc);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:background .25s,color .25s}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem}
.name{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(3rem,16vw,5.2rem);line-height:.9;letter-spacing:.01em;text-wrap:balance}
.cue{font-weight:600;font-size:1.05rem}
.digits{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(6rem,36vw,11rem);line-height:.86;text-align:center;padding-block:6px}
.strip{position:relative;display:flex;gap:2px;height:12px}
.seg{flex:1 1 0;background:var(--oc);opacity:.75;border-radius:2px}
.seg.past{opacity:.2}
.head{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--oc);border-radius:2px}

.next{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;background:var(--surface);border-radius:16px;padding:14px 16px}
.next .lab{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--muted)}
.next .nn{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:2rem;line-height:1}
.next .nc{color:var(--muted);font-size:.92rem}
.swatch{width:14px;align-self:stretch;border-radius:4px;background:var(--c);min-height:44px}

.panel{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.panel p{margin:0;color:var(--muted);font-size:.92rem}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:14px;min-height:54px;padding-inline:18px;font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:.06em;text-transform:uppercase}
.btn.line{background:transparent;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.syncrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.syncrow input{min-width:0;height:54px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding-inline:14px;font-weight:700;font-size:1.1rem}
.links{display:flex;gap:18px;flex-wrap:wrap}
.ghost{border:0;background:transparent;font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
#msg{color:var(--hard);font-weight:600}

ol.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:3.4rem 14px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:9px;border-top:1px solid var(--line)}
.plan .t{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.plan .dot{height:28px;border-radius:4px;background:var(--c)}
.plan .n{font-weight:700}
.plan .n small{display:block;font-weight:400;color:var(--muted)}
.plan .lvl{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.plan li.past{opacity:.45}
.plan li.now .n::after{content:" · now";font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.stage{transition:none}}
</style>

</head>
<body>
<main class="app">
  <section class="stage e-none" id="stage" aria-label="Current run">
    <div class="top"><span id="state">Up first</span><span id="count"></span></div>
    <div class="name" id="name" aria-live="polite"></div>
    <div class="cue" id="cue"></div>
    <div class="digits" id="digits" role="timer">2:00</div>
    <div class="strip" id="strip" aria-hidden="true"></div>
  </section>

  <section class="next e-none" id="nextbox" aria-label="Next run">
    <div class="swatch"></div>
    <div><div class="lab" id="nextlab">Next</div><div class="nn" id="nextname"></div><div class="nc" id="nextcue"></div></div>
  </section>

  <section class="panel" id="startpanel">
    <h2>Start together</h2>
    <p>Everyone enters the same start time and the phones stay in step by the clock. Late? Enter the same time and you join mid-run.</p>
    <div class="syncrow">
      <input type="time" id="at" aria-label="Group start time">
      <button class="btn" id="arm" type="button">Set</button>
    </div>
    <button class="btn line" id="now" type="button">Start now</button>
    <div id="msg" role="status"></div>
  </section>

  <section class="panel" id="runpanel" hidden>
    <div class="links">
      <button class="ghost" id="sound" type="button" aria-pressed="true">Voice and beeps on</button>
      <button class="ghost" id="stop" type="button">Stop and reset</button>
    </div>
    <div class="links" id="confirm" hidden>
      <span>Stop this run?</span>
      <button class="ghost" id="yes" type="button">Yes, stop</button>
      <button class="ghost" id="no" type="button">Keep going</button>
    </div>
    <p>Keep the screen on and this page open. A locked phone goes silent.</p>
  </section>

  <section class="panel">
    <h2>The plan</h2>
    <p id="plansum"></p>
    <ol class="plan" id="plan"></ol>
  </section>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
/* colour, name, cue, seconds */
const PLAN=[
  ['easy','Comfortable jog','Warm up. Easy and relaxed.',300],
  ['steady','Controlled pace','Pick it up a little. Stay in control.',120],
  ['hard','Fast','80–85% effort.',60],
  ['easy','Easy recovery jog','Bring the breath down. Keep jogging.',120],
  ['hard','Fast','85–90% effort.',120],
  ['easy','Easy recovery','Bring the breath down. Keep jogging.',120],
  ['tempo','Moderate','Strong, steady pace.',180],
  ['sprint','Fast','90% effort.',60],
  ['easy','Easy recovery jog','Bring the breath down. Keep jogging.',120],
  ['hard','Fast','85–90% effort.',120],
  ['tempo','Build to finish','Start easy, gradually increase to a strong finish.',180]
];
const N=PLAN.length,STARTS=[];let TOTAL=0;
PLAN.forEach(b=>{STARTS.push(TOTAL);TOTAL+=b[3];});
const mins=s=>(s/60)+' min';
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
let startAt=null,soundOn=true,ac=null,wl=null,lastIdx=-2,lastSec=null,warned=-1;
try{const s=JSON.parse(localStorage.getItem('tribefartlek')||'null');
  if(s){soundOn=s.soundOn!==false;if(s.startAt&&Date.now()-s.startAt<TOTAL*1000)startAt=s.startAt;}}catch(e){}
function save(){try{localStorage.setItem('tribefartlek',JSON.stringify({startAt,soundOn}));}catch(e){}}

/* plan list + strip */
$('plansum').textContent=N+' parts, '+(TOTAL/60)+' minutes in all.';
PLAN.forEach((b,i)=>{
  const li=document.createElement('li');li.className='e-'+b[0];
  li.innerHTML='<span class="t">'+fmt(STARTS[i])+'</span><span class="dot"></span><span class="n">'+b[1]+'<small>'+b[2]+'</small></span><span class="lvl">'+mins(b[3])+'</span>';
  $('plan').appendChild(li);
  const s=document.createElement('div');s.className='seg';s.style.flexGrow=b[3];$('strip').appendChild(s);
});
const head=document.createElement('div');head.className='head';$('strip').appendChild(head);

/* sound */
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}}
function beep(freq,dur,when,vol){
  if(!soundOn||!ac)return;
  try{const t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}
}
function say(text){
  if(!soundOn)return;
  try{const u=new SpeechSynthesisUtterance(text.replace(/–/g,' to ').replace(/%/g,' percent'));u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{wl=l;}).catch(()=>{});}catch(e){}}
function releaseWake(){try{wl&&wl.release();}catch(e){}wl=null;}

function setEffort(el,e){el.className=el.className.replace(/e-\w+/,'e-'+e);}
function show(state,count,b,digits,nextLab,nb){
  $('state').textContent=state;$('count').textContent=count;
  if($('name').textContent!==b[1])$('name').textContent=b[1];
  $('cue').textContent=b[2];$('digits').textContent=digits;
  $('nextlab').textContent=nextLab;
  $('nextname').textContent=nb?nb[1]:'Finish';
  $('nextcue').textContent=nb?nb[2]:'That is the session.';
  setEffort($('nextbox'),nb?nb[0]:'none');
}
function mark(idx,pos){
  const segs=$('strip').children,lis=$('plan').children;
  for(let i=0;i<N;i++){segs[i].classList.toggle('past',i<idx);lis[i].classList.toggle('past',i<idx);lis[i].classList.toggle('now',i===idx);}
  head.style.left=Math.min(100,Math.max(0,pos*100))+'%';
}

function tick(){
  const running=startAt!==null;
  $('startpanel').hidden=running;$('runpanel').hidden=!running;
  if(!running){
    setEffort($('stage'),'none');
    show('Up first','Part 1 of '+N,PLAN[0],fmt(PLAN[0][3]),'Then',PLAN[1]);mark(-1,0);lastIdx=-2;return;
  }
  const t=(Date.now()-startAt)/1000;
  if(t<0){ /* armed, waiting for the group start */
    const sec=Math.ceil(-t);
    setEffort($('stage'),'none');
    show('Starting in','Part 1 of '+N,PLAN[0],fmt(-t),'Then',PLAN[1]);mark(-1,0);
    if(sec!==lastSec){if(lastSec!==null&&sec<=3)beep(880,0.12,0,0.2);lastSec=sec;}
    lastIdx=-1;return;
  }
  let idx=0;while(idx<N&&t>=STARTS[idx]+PLAN[idx][3])idx++;
  if(idx>=N){
    if(lastIdx!==N){lastIdx=N;beep(880,0.18);beep(1100,0.18,0.22);beep(1320,0.7,0.44);say('Session complete. Nice work.');buzz([200,100,200,100,500]);releaseWake();}
    setEffort($('stage'),'none');
    show('Done','',['none','Finished','Walk it off and get some water.'],fmt(TOTAL),'Next',null);
    mark(N,1);return;
  }
  const b=PLAN[idx],nb=PLAN[idx+1],rem=STARTS[idx]+b[3]-t;
  setEffort($('stage'),b[0]);
  show('Now','Part '+(idx+1)+' of '+N,b,fmt(rem),'Next',nb);
  mark(idx,t/TOTAL);
  if(idx!==lastIdx){
    const joining=lastIdx===-2&&rem<b[3]-3;
    lastIdx=idx;lastSec=null;
    if(!joining){beep(b[0]==='easy'?520:1320,0.6);buzz(b[0]==='easy'?[150,80,150]:500);}
    say(b[1]+'. '+b[2]);
  }
  const sec=Math.ceil(rem);
  if(sec!==lastSec){
    if(sec===15&&warned!==idx){warned=idx;say(nb?'Coming up, '+nb[1]:'Fifteen seconds to the finish');}
    if(lastSec!==null&&sec<=3)beep(880,0.12,0,0.2);
    lastSec=sec;
  }
}

function begin(ms){startAt=ms;lastIdx=-2;lastSec=null;warned=-1;save();initAudio();wake();$('msg').textContent='';tick();}
$('now').addEventListener('click',()=>begin(Date.now()));
$('arm').addEventListener('click',()=>{
  const v=$('at').value;
  if(!v){$('msg').textContent='Pick the start time first, for example 06:30.';return;}
  const p=v.split(':').map(Number),d=new Date();d.setHours(p[0],p[1],0,0);
  let ms=d.getTime();
  if(Date.now()-ms>=TOTAL*1000)ms+=86400000; /* already over today: treat as tomorrow */
  if(ms-Date.now()>12*3600*1000){$('msg').textContent='That time is more than 12 hours away. Check the time and try again.';return;}
  begin(ms);
});
$('stop').addEventListener('click',()=>{$('confirm').hidden=false;});
$('no').addEventListener('click',()=>{$('confirm').hidden=true;});
$('yes').addEventListener('click',()=>{
  startAt=null;$('confirm').hidden=true;save();releaseWake();
  try{speechSynthesis.cancel();}catch(e){}
  tick();
});
function soundLabel(){$('sound').textContent=soundOn?'Voice and beeps on':'Voice and beeps off';$('sound').setAttribute('aria-pressed',soundOn);}
$('sound').addEventListener('click',()=>{soundOn=!soundOn;soundLabel();save();if(!soundOn){try{speechSynthesis.cancel();}catch(e){}}});
document.addEventListener('click',()=>{if(startAt!==null){initAudio();if(!wl)wake();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&startAt!==null){wake();tick();}});
soundLabel();tick();setInterval(tick,200);
})();
</script>
</body>
</html>
